function shop(){let g=D('groc').filter(i=>i.status=='got'),t=g.reduce((s,i)=>s+(+i.qty||1)*(+i.price||0),0);if(!g.length)return alert('Check items off first.');D('exp').push({id:uid(),type:'expense',amount:t,date:td(),category:'groceries',method:'card',merchant:'Grocery trip'});st.d.groc=D('groc').filter(i=>i.status!='got');save();go()}
let V='home',Q='';
let unl=!st.lock;function go(v){if(st.lock&&!unl){let p=prompt('Enter your PIN');if(p===st.lock)unl=true;else{document.getElementById('app').innerHTML='<div class=w><h2>Locked</h2><button class=b onclick=go()>Try again</button></div>';return}}if(v){V=v;if(v in K){st.rec=[v,...st.rec.filter(x=>x!=v)].slice(0,3);save()}scrollTo(0,0)}theme();let h=V=='home'?home():V=='dir'?dir():V=='set'?setg():trk(V);document.getElementById('app').innerHTML=h}
function home(){let h=new Date().getHours(),g=h<5?'Still awake':h<12?'Good morning':h<18?'Good afternoon':'Good evening';
 return`<div class=w style="min-height:100vh;display:flex;flex-direction:column;justify-content:center"><div class=arch>${S('moon',92,'top:-30px;left:50%;margin-left:-46px;color:var(--fg)')}${S('bat',70,'left:-36px;top:38%;transform:rotate(-12deg)')}${S('bat',48,'right:-22px;top:26%;transform:scaleX(-1) rotate(8deg)')}${S('moth',60,'right:10%;top:60px;opacity:.7')}${S('raven',64,'left:6%;bottom:-18px')}${S('cross',26,'right:12%;bottom:14px;opacity:.8')}${S('skull',38,'left:18%;top:70px;opacity:.5;transform:rotate(-14deg)')}<small>${g}${st.name?', '+esc(st.name):''}</small><h1 style="font-size:2.7em;margin:6px 0">${st.name?esc(st.name)+'’s<br>':''}Personal Tracker</h1><p><small>Books · Gifts · Expenses · Grocery · Birthdays · Movies</small></p>${rem()}<p><input placeholder="Type your name (saved on this device)" value="${esc(st.name)}" style="max-width:260px;text-align:center" onchange="st.name=this.value.trim();save();go()"></p><button class=b onclick="go('dir')">Open Trackers</button><p><small>${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</small></p></div></div>`}
function nav(t){return`<div class=row style="justify-content:space-between"><div class=row><button class=g onclick="go('home')">Home</button>${V!='dir'?`<button class=g onclick="go('dir')">Directories</button>`:''}</div><button class=g onclick="go('set')">Settings</button></div><div style="text-align:center;margin:14px 0">${S('bat',50,'position:static;display:inline-block;transform:scaleX(-1)')} <h1 style="display:inline;font-size:2.2em;vertical-align:middle">${t}</h1> ${S('bat',50,'position:static;display:inline-block')}</div>`}
function dir(){let ks=Object.keys(K).sort((a,b)=>K[a].n.localeCompare(K[b].n));if(st.ord.length==6)ks=st.ord;ks=[...ks.filter(k=>st.pin.includes(k)),...ks.filter(k=>!st.pin.includes(k))];
 let hits=Q?Object.keys(K).flatMap(k=>D(k).filter(i=>JSON.stringify(i).toLowerCase().includes(Q.toLowerCase())).map(i=>`<div class=c onclick="go('${k}')" style="cursor:pointer"><small>${K[k].n}</small><br>${det(k,i)}</div>`)).join('')||'<small>Nothing matches.</small>':'';
 return`<div class=w>${nav('Directories')}<input placeholder="Search every tracker" value="${esc(Q)}" oninput="Q=this.value;go()" onfocus="this.setSelectionRange(99,99)" ${Q?'autofocus':''}>${Q?hits:`${st.rec.length?`<p><small>Recently opened: ${st.rec.map(k=>`<a href=# style="color:var(--at)" onclick="go('${k}');return false">${K[k].n}</a>`).join(' · ')}</small></p>`:''}<div class=gr style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:26px">${ks.map(k=>`<div class="c cd" draggable=true data-k=${k} ondragstart="event.dataTransfer.setData('k','${k}')" ondragover="event.preventDefault()" ondrop="drop(event,'${k}')" onclick="go('${k}')">${S(K[k].i,44,'')}<h2>${K[k].n}</h2><small>${live(k)}</small><br><button class=g style="margin-top:6px" onclick="event.stopPropagation();pin('${k}')">${st.pin.includes(k)?'Pinned':'Pin'}</button></div>`).join('')}</div><p style="text-align:center"><small>Drag cards to reorder. Otherwise A to Z.</small></p><p style="text-align:center"><button class=g onclick="go('wrap')">Yearly Wrapped</button> <button class=g onclick="print()">Print</button></p>`}</div>`}
function live(k){let a=D(k);return k=='books'?cnt(a,i=>i.status=='done')+' books read':k=='gifts'?cnt(a,i=>['idea','shortlisted'].includes(i.status))+' ideas pending':k=='exp'?$(a.filter(i=>i.type!='income'&&(i.date||'').slice(0,7)==mon).reduce((s,i)=>s+(+i.amount||0),0))+' this month':k=='groc'?cnt(a,i=>i.status=='tobuy')+' items to buy':k=='bday'?(a.length?(a.map(nb).sort((p,q)=>p.days-q.days)[0].days+' days to next birthday'):'No birthdays yet'):cnt(a,i=>i.status=='watched')+' watched'}
function pin(k){st.pin=st.pin.includes(k)?st.pin.filter(x=>x!=k):[...st.pin,k];save();go()}
function drop(e,t){e.preventDefault();let f=e.dataTransfer.getData('k'),o=(st.ord.length==6?st.ord:Object.keys(K).sort((a,b)=>K[a].n.localeCompare(K[b].n))).filter(x=>x!=f);o.splice(o.indexOf(t),0,f);st.ord=o;save();go()}
function trk(k){let c=K[k],a=D(k);if(c.v)return`<div class=w>${nav(c.n)}${chips(k)}${c.v()}</div>`;let h=`<div class=w>${nav(c.n)}<button class=b onclick="edit('${k}')">Add</button> ${k=='books'?`<button class=g onclick="surprise()">Surprise me (TBR)</button> <button class=g onclick="csv()">Export CSV</button>`:''} ${k=='bday'?`<button class=g onclick="ics()">Export to calendar (.ics)</button>`:''}${chips(k)}<div class=gr style="margin-top:12px">${stats(k)}</div>`;
 let card=i=>`<div class=c>${S(['bat','moth','cross'][k.length%3],34,'right:6px;top:-16px;opacity:.85')}${det(k,i)}<div class=row style="margin-top:6px">${acts(k,i)}<button class=g onclick="edit('${k}','${i.id}')">Edit</button><button class=g onclick="if(confirm('Delete?')){st.d['${k}']=D('${k}').filter(x=>x.id!='${i.id}');save();go()}">Delete</button></div></div>`;
 if(c.sec)h+=c.sec.map(([s,n])=>{let l=a.filter(i=>i.status==s);return`<h2 style="margin-top:18px">${n} <small>(${l.length})</small></h2>${l.map(card).join('')||'<small>Empty. Use Add.</small>'}`}).join('');
 else{let l=[...a];if(k=='exp')l.sort((p,q)=>(q.date||'').localeCompare(p.date||''));if(k=='bday')l.sort((p,q)=>(p.date?nb(p).days:999)-(q.date?nb(q).days:999));h+=(l.map(card).join('')||'<small>Empty. Use Add.</small>')}
 return h+'</div>'}
function surprise(){let t=D('books').filter(i=>i.status=='tbr');if(!t.length)return alert('Your TBR is empty.');let b=t[Math.floor(Math.random()*t.length)];alert('Read next: '+b.title)}
function csv(){let r=D('books'),h=['title','author','genre','status','pages','words','hours','rating','start','end'],t=[h,...r.map(i=>h.map(x=>'"'+String(i[x]??'').replace(/"/g,'""')+'"'))].map(x=>x.join(',')).join('\n');dl(t,'books.csv','text/csv')}
function dl(t,n,m){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function edit(k,id){let c=K[k],i=id?D(k).find(x=>x.id==id):{status:c.sec?c.sec[0][0]:'',date:k=='exp'||k=='mov'?'':'',type:'expense'};if(!id&&k=='exp')i.date=td();
 let names=k=='gifts'?`<datalist id=pp>${D('bday').map(b=>`<option value="${esc(b.name)}">`).join('')}</datalist>`:'';
 m.innerHTML=`<div class=c><h2>${id?'Edit':'Add'} ${c.n}</h2>${names}${c.f.map(([n,l,t,o])=>`<label>${l}</label>`+(t=='s'?`<select name=${n}>${sel(o,i[n])}</select>`:t=='i'?`<input type=hidden name=${n} value="${i[n]||''}"><input type=file accept="image/*" onchange="img(this)">`:t=='f'?`<input type=file accept=".txt" onchange="txt(this)">`:`<input name=${n} type=${t=='n'?'number step=any':t=='d'?'date':'text'} value="${esc(i[n])}" ${n=='person'?'list=pp':''}>`)).join('')}<div class=row style="margin-top:14px"><button class=b onclick="sv('${k}','${id||''}')">Save</button><button class=g onclick="m.style.display='none'">Cancel</button></div></div>`;m.style.display='block'}
function sv(k,id){let o=id?D(k).find(x=>x.id==id):{id:uid()};m.querySelectorAll('[name]').forEach(e=>o[e.name]=e.value);if(!id)D(k).push(o);post(k,o);save();m.style.display='none';go()}
function img(e){let f=e.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,260/i.width);c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);e.previousElementSibling.value=c.toDataURL('image/jpeg',.75)};i.src=r.result};r.readAsDataURL(f)}
function txt(e){let f=e.files[0];if(!f)return;f.text().then(t=>{let w=(t.match(/\S+/g)||[]).length;m.querySelector('[name=words]').value=w;m.querySelector('[name=pages]').value=Math.ceil(w/250)})}
function setg(){return`<div class=w>${nav('Settings')}<div class=c><h3>Display</h3><label>Name</label><input value="${esc(st.name)}" onchange="st.name=this.value.trim();save()"><label>Currency</label><select onchange="st.cur=this.value;save()">${sel(['USD','EUR','GBP','PHP','CAD','AUD','JPY','INR','SGD','KRW'],st.cur)}</select><label>Date format</label><select onchange="st.df=this.value;save()">${['MDY','DMY','YMD'].map(x=>`<option ${x==st.df?'selected':''}>${x}</option>`).join('')}</select></div><div class=c><h3>PIN lock</h3><input type=password placeholder="Leave empty for no PIN" value="${esc(st.lock||'')}" onchange="st.lock=this.value;save()"><p><button class=g onclick="let b=localStorage.getItem('ptk_bak');if(b&&confirm('Restore the snapshot from before today?')){st=Object.assign(st,JSON.parse(b));save();go()}">Restore automatic snapshot</button></p></div><div class=c><h3>Data</h3><p><small>Everything is saved in this browser, no account needed. Clearing site data erases it, so export a backup now and then.</small></p><div class=row><button class=b onclick="dl(JSON.stringify(st),'tracker-backup.json','application/json')">Export backup</button><input type=file accept=.json style="width:auto" onchange="this.files[0].text().then(t=>{st=Object.assign(st,JSON.parse(t));save();go()})"></div></div><div class=c><h3>Themes (${TH.length}, A to Z)</h3>${TH.map(t=>`<div class="th ${t[0]==st.th?'on':''}" onclick="st.th='${t[0]}';save();go()"><span class=sw><i style="background:#${t[1]}"></i><i style="background:#${t[2]}"></i></span>${t[0]}</div>`).join('')}</div></div>`}
go();
</script></body></html>
